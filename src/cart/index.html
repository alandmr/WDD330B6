<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Cart</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <script src="../js/cart.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header">
      <!-- header is rendered dinamically -->
    </header>

    <main class="divider">
      <section class="products">
        <h2>My Cart</h2>

        <ul class="product-list">
          <!-- Products in cart are loaded dinamically -->
        </ul>
        <div class="cart-footer hide">
          <p class="cart-total">
            <strong>Total:</strong> $<span id="cart-total"></span>
          </p>
        </div>
      </section>
    </main>

    <footer id="footer">
      <!-- footer is loaded dinamically-->
    </footer>
  </body>
</html>
