<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Home</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="/js/main.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="header">
      <!-- Header inserted dinamically -->
    </header>
    <main class="divider">
      <div class="hero">
        <img
          src="/images/banner.jpg"
          srcset="images/banner-sm.jpg 500w, images/banner.jpg"
          alt="image of a high mountain lake"
        />
        <div class="logo logo--square">
          <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
          <div>Sleep<span class="highlight">Outside</span></div>
        </div>
        <div class="mission">
          <p>
            Our mission is to provide you with everything you need to sleep
            outside comfortably at an affordable price.
          </p>
        </div>
      </div>

      <section class="categories">
        <h2>Categories</h2>
        <ul class="category-list">
          <li>
            <a
              href="/product_listing/?category=tents"
              class="invisible-link svg-link"
            >
              <img src="/images/svg/tent.svg" alt="Tent icon" />
              <span>Tents</span>
            </a>
          </li>
          <li>
            <a
              href="/product_listing/?category=backpacks"
              class="invisible-link svg-link"
            >
              <img src="/images/svg/backpack.svg" alt="Backpack icon" />
              <span>Backpacks</span>
            </a>
          </li>
          <li>
            <a
              href="/product_listing/?category=sleeping-bags"
              class="invisible-link svg-link"
            >
              <img src="/images/svg/sleeping-bag.svg" alt="Sleeping Bag icon" />
              <span>Sleeping Bags</span>
            </a>
          </li>
          <li>
            <a
              href="/product_listing/?category=hammocks"
              class="invisible-link svg-link"
            >
              <img src="/images/svg/hammock.svg" alt="Hammock icon" />
              <span>Hammocks</span>
            </a>
          </li>
        </ul>
      </section>
    </main>
    <footer id="footer">
      <!-- Footer inserted dinamically -->
    </footer>
  </body>
</html>
